<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Fallback Redirect: This will run after 2 seconds if JavaScript is disabled. -->
    <meta http-equiv="refresh" content="2; url=https://saadatnotebook.rf.gd/">
    
    <title>Loading Saadat Notebook...</title>
    
    <!-- Google Fonts to match your website -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script>
        // This script runs instantly to prevent a "white flash" on dark mode.
        (function () {
            try {
                const theme = localStorage.getItem('saadatNotesTheme');
                const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (theme === 'dark' || (!theme && systemPrefersDark)) {
                    document.documentElement.classList.add('dark-mode');
                }
            } catch (e) {}
        })();
    </script>
    
    <style>
        /* Define colors based on your website's style.css */
        :root {
            --light-bg: #f8fafc;
            --light-text: #1f2937;
            --light-loader-track: #e0e0e0;
            --light-loader-color: #0a0a0a;

            --dark-bg: #121212;
            --dark-text: #e9ecef;
            --dark-loader-track: #373737;
            --dark-loader-color: #ffffff;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        body {
            background-color: var(--light-bg);
            color: var(--light-text);
        }

        .dark-mode body {
            background-color: var(--dark-bg);
            color: var(--dark-text);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        
        .logo {
            width: 64px;
            height: 64px;
            border-radius: 12px;
        }
        
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }
        
        p {
            font-size: 1rem;
            color: #6c757d;
            margin: 0;
        }

        .loader {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border-style: solid;
            border-width: 4px;
            margin-top: 1rem;
            animation: spin 1s linear infinite;
        }
        
        .loader {
            border-color: var(--light-loader-track);
            border-top-color: var(--light-loader-color);
        }
        .dark-mode .loader {
            border-color: var(--dark-loader-track);
            border-top-color: var(--dark-loader-color);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    
    <div class="container">
        <!-- Make sure the path to your logo is correct relative to this index.html -->
        <img src="https://saadatnotebook.rf.gd/images/logo.png" alt="Saadat Notebook Logo" class="logo">
        <h1>Saadat Notebook</h1>
        <p>Department of Mathematics</p>
        <div class="loader"></div>
    </div>

    <script>
        // Primary Redirect: This uses JavaScript for a smoother transition.
        // The small delay ensures the user sees the loading screen.
        setTimeout(function() {
            window.location.replace("https://saadatnotebook.rf.gd/");
        }, 500); // 500 milliseconds (half a second) delay
    </script>
    
</body>
</html>
